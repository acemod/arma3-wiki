id: ParachuteLanded
description: Executes assigned code when steerable or non-steerable parachute lands.
params:
- name: parachute
  description: The parachute object
  type: Object
- name: driver
  description: Person that was in parachute driver seat or [[objNull]]
  type: Object
- name: attachedObjects
  description: Objects that were attached to the parachute or []
  type: ArrayUnknown
- name: onwater
  description: '[[true]] if water landing'
  type: Boolean
since:
  arma_3:
    major: 2
    minor: 24
argument_loc: Unspecified
effect_loc: Unspecified
examples:
- "addMissionEventHandler [\"ParachuteLanded\", {\n\tparams [\"_parachute\", \"_driver\", \"_attachedto\", \"_onwater\"];\n}];"
