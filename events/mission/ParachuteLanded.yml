id: ParachuteLanded
description: Executes assigned code when steerable or non-steerable parachute lands.
params:
- name: parachute
  description: The parachute object
  type: Object
- name: driver
  description: Person in parachute driver seat
  type: Object
- name: attachedto
  description: Cargo object (if attached to parachute)
  type: Object
- name: onwater
  description: '[[true]] if water landing'
  type: Boolean
since:
  arma_3:
    major: 2
    minor: 24
argument_loc: Unspecified
effect_loc: Unspecified
examples:
- "addMissionEventHandler [\"ParachuteLanded\", {\n\tparams [\"_parachute\", \"_driver\", \"_attachedto\", \"_onwater\"];\n}];"
