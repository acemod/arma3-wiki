name: diag_activeScripts
description: Returns 4 element array with numbers of currently running scripts
groups:
- Diagnostic
syntax:
- call: Nular
  ret:
  - Unknown
  - |-
    The number of scripts running with [[spawn]]
    * execVM: [[Number]] - The number of scripts running with [[execVM]]
    * exec: [[Number]] - The number of scripts running with [[exec]]
    * execFSM: [[Number]] - The number of scripts running with [[execFSM]]
  params: []
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma_3:
    major: 1
    minor: 64
examples:
- <sqf>hint str diag_activeScripts; //[0,0,0,1]</sqf>
