name: say3D
description: |-
  Lets an object say given sound in 3D space.
  This allows broadcasting of positional music or sound from a source, without having to script a fade sound or music command. The source has to be [[alive]].
  Compare this with [[say2D]] which will always play a sound at the location of the player after he has been in the vicinity of a broadcasting sound.
  Sound is defined in {{Link|Description.ext#CfgSounds|"CfgSounds"}} of the [[Description.ext]] or main config.

  {{Feature|informative|
  The name of the command is the clue to its usage. It is meant for playing short sounds within short range. Consecutive execution of the command queues the sounds, the next sound would not start until the previous sound is finished, hence the need for the short sounds. The simulation of speed of sound would delay next sound and might mess with the timing of the queued sounds, especially if used globally. Additionally the sounds are not synced for JIP players. A long playing sound will not be heard by newly joined payers. To summarise:

  * An object can only "say" '''one''' sound at a time
  * In order to stop a [[say3D]] sound: delete the returned '''sound source''' with [[deleteVehicle]], or kill the '''sound source''' with e.g [[setDamage]].
  * Forcing the speed of sound simulation may delay the queued sound to play right after the previous sound, even if the second sound does not simulate sound delay (e.g sound 1 plays with a 5s delay, ends, ''then'' sound 2 plays). If the queued sound uses speed of sound simulation, it will be delayed from the end of the first sound (they will not follow "as expected"). Makes the ''offset'' parameter ignored.
  * '''Do use''' it for short distance short sounds with speed of sound simulation off.
  * When used with 'isGlobal' option, a null [[NetObject]] is returned. To stop such sound globally, destroy the sound source 'from' object.
  }}
groups:
- Sounds
syntax:
- call: !Binary
  - from
  - sound
  ret:
  - Object
  - the sound source or null [[NetObject]] - when 'isGlobal' is [[true]]
  params:
  - name: from
    type: Unknown
  - name: sound
    type: Unknown
argument_loc: Global
effect_loc: Local
since:
  arma_2:
    major: 1
    minor: 0
  arma_2_arrowhead:
    major: 1
    minor: 50
  take_on_helicopters:
    major: 1
    minor: 0
  arma_3:
    major: 0
    minor: 50
examples:
- |-
  All possible combinations:
  <sqf>
  helicopter1 say3D "FortunateSon";
  helicopter1 say3D ["FortunateSon", 500, 1, 0, 0, true];
  [helicopter1, player] say3D "FortunateSon";
  [helicopter1, player] say3D ["FortunateSon", 500, 1, 0, 0, true];
  </sqf>
- "Workaround for dead bodies:\n<sqf>\nprivate _dummy = \"#particlesource\" createVehicleLocal ASLToAGL getPosWorld _corpse;\n_dummy say3D \"whatever\";\n_dummy spawn {\n\tsleep 5; // at least the length of your sound\n\tdeleteVehicle _this;\n};\n</sqf>"
- |-
  <sqf>
  // Since {{arma3}} v2.00, the sound source is returned and can be deleted directly
  _soundSrc = helicopter1 say3D "Fortunateson";
  sleep 5;
  deleteVehicle _soundSrc; // stop the sound after ~5 seconds
  </sqf>
