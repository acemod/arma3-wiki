name: getItemCargo
description: Returns all items names and count from ammo box (or any general weapon holder container).
groups:
- Vehicle Inventory
syntax:
- call: !Unary box
  ret:
  - Unknown
  - |-
    Item class names
    * counts: [[Array]] of [[Number]]s - Item counts
  params:
  - name: box
    type: Object
argument_loc: Global
effect_loc: Unspecified
since:
  arma_3:
    major: 0
    minor: 50
examples:
- "<sqf>\ngetItemCargo cursorTarget;\n/*\n\treturns e.g\n\t[\n        [\"5ItemA\", \"10ItemB\"]\n        [5, 10]\n\t]\n*/\n</sqf>"
