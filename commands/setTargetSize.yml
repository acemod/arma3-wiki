name: setTargetSize
description: |-
  Sets target size (see irTargetSize and others from vehicle config) override on vehicle.
  Returns the previously active values. Note if the array is empty, it will only return the previous/current values, and not set new ones. So this also functions as a getter.
groups: []
syntax:
- call: !Binary
  - vehicle
  - - visualTargetSize
    - irTargetSize
    - radarTargetSize
  ret:
  - Unknown
  - |-
    previous value
    * irTargetSize[[Number]] - previous value
    * radarTargetSize[[Number]] - previous value
  params:
  - name: vehicle
    description: A transport vehicle
    type: Object
  - name: visualTargetSize
    description: set to -1 to disable override and use config values. Otherwise value between 0-2
    type: Number
  - name: irTargetSize
    type: Number
  - name: radarTargetSize
    type: Number
argument_loc: Global
effect_loc: Local
since:
  arma_3:
    major: 2
    minor: 22
examples:
- <sqf>_previous = vehicle player setTargetSize [0,0,0];</sqf>
- <sqf>_sizes = vehicle player setTargetSize [];</sqf>
