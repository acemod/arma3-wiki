name: radioChannelSetCallSign
description: Set the custom radio chat channel's callsign / VoN callsign.
groups:
- Radio and Chat
- Custom Radio and Chat
syntax:
- call: !Binary
  - customChannelID
  - callSign
  ret:
  - Nothing
  - null
  params:
  - name: customChannelID
    description: '[[Channel IDs|custom channel ID]] returned by [[radioChannelCreate]] command'
    type: Number
  - name: callSign
    description: |-
      custom chat callsign or [callSign, callSignVoN]. Available parameters: <spoiler>
      {| class="wikitable"
      ! Parameter !! Description !! Example
    type: Unknown
argument_loc: Global
effect_loc: Global
since:
  take_on_helicopters:
    major: 1
    minor: 0
  arma_3:
    major: 0
    minor: 50
examples:
- <sqf>4 radioChannelSetCallSign "(%UNIT_ID) %UNIT_RANK %UNIT_NAME%UNIT_GRP_LEADER"; // (1) Sgt Ben Kelly, group leader</sqf>
- <sqf>4 radioChannelSetCallSign ["%UNIT_VEH_POSITION, %UNIT_VEH_NAME", "%UNIT_NAME%UNIT_GRP_LEADER"];</sqf>
