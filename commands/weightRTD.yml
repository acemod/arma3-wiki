name: weightRTD
description: '{{Feature|afm}}Returns weight of RTD helicopter.'
groups:
- RTD
syntax:
- call: !Unary helicopter
  ret:
  - Unknown
  - |-
    weights in kilograms
    * fuselage: [[Number]] - weight of the fuselage
    * crew: [[Number]] - weight of the crew
    * fuel: [[Number]] - weight of the fuel
    * custom: [[Number]] - weight set with [[setCustomWeightRTD]]
    * weapons: [[Number]] - weight of the weapons
  params:
  - name: helicopter
    type: Object
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma_3:
    major: 1
    minor: 34
examples:
- <sqf>_taruWeight = weightRTD taru// Returns [7000,300,1990.56,0,0]</sqf>
