name: ctrlText
description: |-
  Returns the text of a control of the currently active user dialog. This command can be used on static texts, buttons, edit lines and active texts as well as for images, where it returns the image path. Does not work on HTML control and returns empty string "". Since {{GVI|arma3|2.05|size= 0.75}} supported control types are:
  {{Columns|4|* [[CT_STATIC]]

  * [[CT_EDIT]]
  * [[CT_XKEYDESC]]
  * [[CT_XBUTTON]]
  * [[CT_SHORTCUTBUTTON]]
  * [[CT_STRUCTURED_TEXT]]
  * [[CT_BUTTON]]
  * [[CT_ACTIVETEXT]]
  }}

  Since {{GVI|arma3|2.20|size= 0.75}} [[CT_PROGRESS]] is also supported.
groups:
- GUI Control
syntax:
- call: !Unary idc
  ret:
  - String
  - the text or image path or texture is returned, dependent on the control type
  params:
  - name: idc
    description: control ID
    type: Number
- call: !Unary controlName
  ret:
  - String
  - the text or image path or texture is returned, dependent on the control type
  params:
  - name: controlName
    description: control
    type: Control
argument_loc: Unspecified
effect_loc: Unspecified
since:
  flashpoint:
    major: 1
    minor: 75
  flashpoint_elite:
    major: 1
    minor: 0
  armed_assault:
    major: 1
    minor: 0
  arma_2:
    major: 1
    minor: 0
  arma_2_arrowhead:
    major: 1
    minor: 50
  take_on_helicopters:
    major: 1
    minor: 0
  arma_3:
    major: 0
    minor: 50
examples:
- <sqf>_text = ctrlText 100;</sqf>
- <sqf>_text = ctrlText _control;</sqf>
