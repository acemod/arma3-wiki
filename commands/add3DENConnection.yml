name: add3DENConnection
description: '[[Eden Editor: Connecting|Connect]] entities together. Be aware to select the correct type of [[Eden Entity|Eden Entities]] for the connection type.'
groups:
- Eden Editor
syntax:
- call: !Unary
  - type
  - from
  - to
  ret:
  - Boolean
  - '[[true]] If the connection was made'
  params:
  - name: type
    type: Unknown
  - name: from
    description: entities which are being connected
    type: Unknown
  - name: to
    description: entity to which entities will be connected to
    type: EdenEntity
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma_3:
    major: 1
    minor: 56
examples:
- <sqf>add3DENConnection ["RandomStart", get3DENSelected "Object", "marker_0"];// Set random start on marker "marker_0" for all selected objects.</sqf>
- |-
  <sqf>
  // Group all selected units to the first selected group
  private _group = get3DENSelected "Group" param [0, grpNull];
  private _units = get3DENSelected "Objects";

  add3DENConnection ["Group", _units, _group];
  </sqf>
