name: infoPanel
description: Returns information about what is currently displayed on given player's info panel.
groups:
- Custom Panels
syntax:
- call: !Unary infoPanelId
  ret:
  - Unknown
  - |-
    ''EmptyDisplay'' when no panel is open
    * componentType: [[String]] -  ''EmptyDisplayComponent'' when no panel is open
  params:
  - name: infoPanelId
    description: info panel classname, or "left" or "right"
    type: String
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma_3:
    major: 1
    minor: 72
examples:
- <sqf>infoPanel "left" params ["_componentClass", "_componentType"];</sqf>
