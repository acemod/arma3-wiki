name: mineDetectedBy
description: Returns [[true]] if mine has been detected by a given side
groups:
- Mines
syntax:
- call: !Binary
  - mine
  - side
  ret:
  - Boolean
  - null
  params:
  - name: mine
    type: Object
  - name: side
    type: Side
argument_loc: Unspecified
effect_loc: Unspecified
since:
