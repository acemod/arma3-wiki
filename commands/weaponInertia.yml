name: weaponInertia
description: Returns current rate of how much the weapon view is distorted because of quick aiming.
groups:
- Weapons
syntax:
- call: !Unary unit
  ret:
  - Unknown
  - |-
    Amount of x-axis sway
    * y: Number - Amount of y-axis sway
  params:
  - name: unit
    type: Object
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma_3:
    major: 1
    minor: 48
examples:
- <sqf>_inertia = weaponInertia player; //[-0.0126307,0.038023]</sqf>
