name: unlinkItem
description: Unassign and delete existing item from its assigned slot. Nothing happens if the item does not exist or is not assigned. See also [[unassignItem]].
groups:
- Unit Inventory
syntax:
- call: !Binary
  - unit
  - item
  ret:
  - Nothing
  - null
  params:
  - name: unit
    type: Object
  - name: item
    type: String
argument_loc: Global
effect_loc: Global
since:
  arma_3:
    major: 1
    minor: 0
examples:
- |-
  <sqf>
  bluforUnit unlinkItem "NVGoggles";
  opforUnit unlinkItem "NVGoggles_OPFOR";
  indepUnit unlinkItem "NVGoggles_INDEP";

  // or
  { _x unlinkItem hmd _x } forEach [bluforUnit, opforUnit, indepUnit];
  </sqf>
