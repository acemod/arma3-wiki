name: lbSetPictureRightColor
description: |-
  Sets the color of the second (right aligned) picture of the item with the given index of the listbox to the given color.
  Color which consists from only zeros means disable this override.
groups:
- GUI Control - ListBox
syntax:
- call: !Binary
  - control
  - - index
    - color
  ret:
  - Nothing
  - null
  params:
  - name: control
    type: Control
  - name: index
    type: Number
  - name: color
    type: ArrayColor
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma_3:
    major: 1
    minor: 22
examples:
- <sqf>_ctrl lbSetPictureRightColor [0, [1, 1, 1, 1]];</sqf>
