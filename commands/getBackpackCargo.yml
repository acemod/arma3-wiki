name: getBackpackCargo
description: Returns all backpack types and count from the cargo space.
groups:
- Containers
syntax:
- call: !Unary object
  ret:
  - Unknown
  - |-
    Backpack class names
    * counts: [[Array]] of [[Number]]s - Backpack counts
  params:
  - name: object
    description: object to check
    type: Object
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma_2_arrowhead:
    major: 1
    minor: 55
  take_on_helicopters:
    major: 1
    minor: 0
  arma_3:
    major: 0
    minor: 50
examples:
- "<sqf>\ngetBackpackCargo cursorTarget;\n/*\n\treturns e.g\n\t[\n        [\"5BackpackA\", \"10BackpackB\"]\n        [5, 10]\n\t]\n*/\n</sqf>"
- <sqf>_content = getBackpackCargo carName;</sqf>
- <sqf>_content = getBackpackCargo ammoBoxName;</sqf>
