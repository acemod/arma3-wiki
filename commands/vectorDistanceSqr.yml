name: vectorDistanceSqr
description: Squared distance between two 3D vectors.
groups:
- Math - Vectors
syntax:
- call: !Binary
  - vector1
  - vector2
  ret:
  - Number
  - null
  params:
  - name: vector1
    description: 3D or {{GVI|arma3|2.00|size= 0.75}} 2D vector (z coordinate is defaulted to 0)
    type: Unknown
  - name: vector2
    description: 3D or {{GVI|arma3|2.00|size= 0.75}} 2D vector (z coordinate is defaulted to 0)
    type: Unknown
argument_loc: Unspecified
effect_loc: Unspecified
since:
  arma_3:
    major: 1
    minor: 22
examples:
- <sqf>_distSqr = getPos player vectorDistanceSqr [0,0,2];</sqf>
