name: setMissionOptions
description: "Sets various mission options. The options are automatically reset between missions and are saved/restored with the save system.<br>\nAvailable Options:\n\n* IgnoreNoDamage: [[Boolean]] - (default [[false]]) [[true]] to filter out no change in damage from {{Link|Arma 3: Event Handlers#HandleDamage|HandleDamage}} calls\n* IgnoreFakeHeadHit: [[Boolean]] - (default [[false]]) [[true]] to filter out FakeHeadHit context from {{Link|Arma 3: Event Handlers#HandleDamage|HandleDamage}} calls\n* IgnoreUpsideDownDamage: [[Boolean]] - (default [[false]]) [[true]] to ignore some minor upside down damage accumulation for a helicopter\n* {{GVI|arma3|2.20|size= 0.75}} SnakesCanOpenDoors: [[Boolean]] - (default [[false]]) [[true]] to revert to legacy behaviour when snakes would open doors when entering houses\n* {{GVI|arma3|2.20|size= 0.75}} AIThinkOnlyLocal: [[Boolean]] - (default [[false]]) [[true]] to disable processing targetting data for remote AI units, [[knowsAbout]], [[targets]] and similar commands will cease to work on remote units. For a gain in client performance because they no longer have to calculate all AI units. \n* {{GVI|arma3|2.24|size= 0.75}} MapSymbolIsHiddenWithTheObject: [[Boolean]] - (default [[true]]) [[true]] to hide map symbol when terrain object is hidden.\n* {{GVI|arma3|2.24|size= 0.75}} MapHideForests: [[Boolean]] - (default [[false]]) [[true]] to hide map symbols for forests.\n* {{GVI|arma3|2.24|size= 0.75}} MapHideRockFormations: [[Boolean]] - (default [[false]]) [[true]] to hide map symbols for rock formations.\n* {{GVI|arma3|2.24|size= 0.75}} MapHideTowns: [[Boolean]] - (default [[false]]) [[true]] to hide map symbols for towns.\n* {{GVI|arma3|2.24|size= 0.75}} MapHideRoads: [[Boolean]] - (default [[false]]) [[true]] to hide map symbols for roads.\n* {{GVI|arma3|2.24|size= 0.75}} MapHideRivers: [[Boolean]] - (default [[false]]) [[true]] to hide map symbols for rivers.\n* {{GVI|arma3|2.24|size= 0.75}} MapHideSigns: [[Boolean]] - (default [[false]]) [[true]] to hide map icons for objects.\n* {{GVI|arma3|2.24|size= 0.75}} MapHideSmallSigns: [[Boolean]] - (default [[false]]) [[true]] to hide map icons for trees, bushes, rocks.\n* {{GVI|arma3|2.24|size= 0.75}} MapHideLocations: [[Boolean]] - (default [[false]]) [[true]] to hide map icons for trees, bushes, rocks.\n\nProviding a empty HashMap will reset all options to defaults."
groups:
- System
syntax:
- call: !Unary options
  ret:
  - Nothing
  - null
  params:
  - name: options
    description: a HashMap containing all the options to be changed
    type: HashMapUnknown
argument_loc: Unspecified
effect_loc: Local
since:
  arma_3:
    major: 2
    minor: 18
examples:
- <sqf>setMissionOptions createHashMapFromArray [["IgnoreNoDamage", true], ["IgnoreFakeHeadHit", true], ["IgnoreUpsideDownDamage", true]];</sqf>
- <sqf>setMissionOptions createHashMap; // reset options to default</sqf>
