name: actionIDs
description: Lists the user actions currently on an entity, so they can be inspected with [[actionParams]], changed with [[setUserActionText]] or removed with [[removeAction]] without keeping track of the IDs [[addAction]] returned.
groups:
- Interaction
syntax:
- call: !Unary entity
  ret:
  - ArrayUnknown
  - IDs of all user actions added to given entity with [[addAction]] command
  params:
  - name: entity
    description: entity with added user actions
    type: Object
argument_loc: Global
effect_loc: Local
since:
  arma_3:
    major: 1
    minor: 64
examples:
- <sqf>_actions = actionIDs player;</sqf>
