name: typeOf
description: Returns the class name of given target.
groups:
- Object Manipulation
syntax:
- call: !Unary target
  ret:
  - String
  - config class name, or empty string if ''target'' does not have a class
  params:
  - name: target
    type: Unknown
argument_loc: Unspecified
effect_loc: Unspecified
since:
  flashpoint:
    major: 1
    minor: 90
  flashpoint_elite:
    major: 1
    minor: 0
  armed_assault:
    major: 1
    minor: 0
  arma_2:
    major: 1
    minor: 0
  arma_2_arrowhead:
    major: 1
    minor: 50
  take_on_helicopters:
    major: 1
    minor: 0
  arma_3:
    major: 0
    minor: 50
examples:
- <sqf>if (typeOf vehicle player == "B_Heli_Light_01_armed_F") then { hint "Player is in a AH-9 Pawnee"; };</sqf>
- |-
  <sqf>
  // Since 2.22
  typeOf (findDisplay 313); // "Display3DEN"
  </sqf>
